name: publish-dsh-puppet

# 通过 npm Trusted Publishing（OIDC）发布 dsh-puppet，无需在仓库里存放 npm token。
# 前置条件：在 npmjs.com 给包 dsh-puppet 配置 GitHub Actions 可信发布方——
#   Repository owner: idleGG
#   Repository name:  puppetry
#   Workflow file name: publish-dsh-puppet.yml（必须与本文件名完全一致）
# 触发：推送形如 dsh-puppet/v0.3.0 的 tag（预发布用 dsh-puppet/v0.4.0-rc.1）。
# 详见仓库文档 src/dsh-puppet/docs/UPDATE-AND-PUBLISH.md。

on:
  push:
    tags:
      - 'dsh-puppet/v*'
  # 允许在 Actions 页面手动重跑（发布当前 package.json 里的版本）。
  workflow_dispatch:

permissions:
  id-token: write   # Trusted Publishing 用 GitHub OIDC 换取 npm 发布凭证
  contents: read

jobs:
  publish:
    name: Publish dsh-puppet to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dsh-puppet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          # 不配置 node-auth-token：Trusted Publishing 走 OIDC，不需要长期 token。

      - name: Run unit tests
        run: npm test

      - name: Resolve and verify version from tag
        id: meta
        if: github.event_name == 'push'
        run: |
          # GITHUB_REF_NAME 形如 dsh-puppet/v0.3.0，去掉前缀得到 semver。
          TAG_VERSION="${GITHUB_REF_NAME#dsh-puppet/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version : $TAG_VERSION"
          echo "pkg version : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本($TAG_VERSION) 与 package.json 版本($PKG_VERSION) 不一致，已中止"
            exit 1
          fi
          # 仅按 semver 预发布标识（含 '-'）判定，避免把命名空间前缀里的连字符误判。
          if echo "$TAG_VERSION" | grep -qE '-'; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (tag push, trusted publishing)
        if: github.event_name == 'push'
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist-tag }}"

      - name: Publish (manual dispatch, trusted publishing)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --provenance --access public
