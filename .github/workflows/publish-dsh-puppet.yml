name: publish-dsh-puppet

# 通过 npm Trusted Publishing（OIDC）发布 dsh-puppet，无需在仓库里存放 npm token。
# 前置条件：在 npmjs.com 给包 dsh-puppet 配置 GitHub Actions 可信发布方——
#   Repository owner: idleGG
#   Repository name:  puppetry
#   Workflow file name: publish-dsh-puppet.yml（必须与本文件名完全一致）
# 触发：推送形如 dsh-puppet/v0.3.0 的 tag（预发布用 dsh-puppet/v0.4.0-rc.1）。
# 版本要求：npm CLI ≥ 11.5.1（Trusted Publishing 官方最低版本；Node 22 自带的
#   npm 10.x 只会用 OIDC 签 provenance，发布鉴权仍走 token 路径，无 token 即 404）。
# 详见仓库文档 src/dsh-puppet/docs/UPDATE-AND-PUBLISH.md。

on:
  push:
    tags:
      - 'dsh-puppet/v*'
  # 允许在 Actions 页面手动重跑（发布当前 package.json 里的版本）。
  workflow_dispatch:

permissions:
  id-token: write   # Trusted Publishing 用 GitHub OIDC 换取 npm 发布凭证
  contents: read

jobs:
  publish:
    name: Publish dsh-puppet to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dsh-puppet

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # 刻意不设置 registry-url：它会生成 .npmrc 里的
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
          # 空 token 会让 npm 先走 token 鉴权路径而不落到 OIDC Trusted Publishing。
          # npm 默认 registry 本来就是 registry.npmjs.org，无需显式指定。

      - name: Upgrade npm to >= 11.5.1 (Trusted Publishing 的最低版本要求)
        run: |
          echo "before: node $(node --version), npm $(npm --version)"
          npm install -g npm@^11.5.1
          echo "after : node $(node --version), npm $(npm --version)"

      - name: Run unit tests
        run: npm test

      - name: DEBUG 打印 OIDC 身份声明（排查 Trusted Publisher 404，完成后删除本步）
        run: |
          TOKEN_RESP="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm")"
          echo "$TOKEN_RESP" | python3 -c "import sys,json,base64; t=json.load(sys.stdin)['value']; p=t.split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); jwr=c.get('job_workflow_ref',''); wf_file=jwr.split('@')[0].split('/')[-1]; print('=== npm Trusted Publisher 各栏应逐字填写 ==='); print('Organization or user =', repr(c.get('repository_owner'))); print('Repository          =', repr((c.get('repository') or '').split('/')[-1])); print('Workflow file name  =', repr(wf_file), '  <-- 必须含 .yml/.yaml 扩展名，不是 name 字段'); print('Environment         =', repr(c.get('environment')), '  <-- 为 None 时 npm 该栏留空'); print('=== 原始 OIDC 关键字段 ==='); print('workflow(name字段, 不含扩展名) =', repr(c.get('workflow'))); print('job_workflow_ref =', repr(jwr))"

      - name: Resolve and verify version from tag
        id: meta
        if: github.event_name == 'push'
        run: |
          # GITHUB_REF_NAME 形如 dsh-puppet/v0.3.0，去掉前缀得到 semver。
          TAG_VERSION="${GITHUB_REF_NAME#dsh-puppet/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version : $TAG_VERSION"
          echo "pkg version : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本($TAG_VERSION) 与 package.json 版本($PKG_VERSION) 不一致，已中止"
            exit 1
          fi
          # 仅按 semver 预发布标识（含 '-'）判定，避免把命名空间前缀里的连字符误判。
          if echo "$TAG_VERSION" | grep -qE '-'; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (tag push, trusted publishing)
        if: github.event_name == 'push'
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist-tag }}"

      - name: Publish (manual dispatch, trusted publishing)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --provenance --access public
