<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSH 远程控制端 · 轻量化控制端原型</title>
<meta name="description" content="DSH 远程控制端 Web 版轻量化控制端 UI 原型：三级可折叠浏览、本地别名、Markdown 会话查看、继续对话，自适应 PC 与移动端。">
<style>
  /* ===================================================================== *
   * 设计令牌 —— 对齐 DeepSeek Harness 暗色界面风格
   * ===================================================================== */
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --bg-2: #0e1320;
    --panel: #121722;
    --panel-2: #171e2b;
    --panel-3: #0d1220;
    --line: #263042;
    --line-soft: #1d2637;
    --text: #e8edf7;
    --text-2: #c9d4e8;
    --muted: #8e9bb3;
    --muted-2: #66738c;
    --accent: #7aa2ff;
    --accent-2: #4f74ff;
    --accent-deep: #315cff;
    --accent-grad: linear-gradient(135deg, #315cff, #5a82ff);
    --good: #45d19a;
    --warn: #f0b35b;
    --bad: #ff6b7a;
    --r-lg: 14px;
    --r-md: 10px;
    --r-sm: 8px;
    --topbar-h: 56px;
    --sidebar-w: 320px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 620px at 8% -12%, #16223a 0%, rgba(22,34,58,0) 58%),
      var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  ::selection { background: #2c3f66; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #263042; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #33415a; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ===================================================================== *
   * 顶栏
   * ===================================================================== */
  .topbar {
    height: var(--topbar-h);
    flex: 0 0 var(--topbar-h);
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(11,14,20,.82);
    backdrop-filter: blur(10px);
    z-index: 30;
  }
  .hamburger {
    display: none;
    width: 36px; height: 36px;
    align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--panel-2); cursor: pointer; color: var(--text-2);
  }
  .hamburger:hover { border-color: #3a4b6b; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-logo {
    width: 34px; height: 34px; flex: 0 0 auto;
    border-radius: 10px; display: grid; place-items: center;
    background: var(--accent-grad); color: #fff;
    box-shadow: 0 4px 14px rgba(49,92,255,.35);
  }
  .brand-logo svg { width: 19px; height: 19px; }
  .brand-copy { min-width: 0; }
  .brand-title { font-size: 15px; font-weight: 650; letter-spacing: .2px; line-height: 1.2; }
  .brand-sub { font-size: 11.5px; color: var(--muted); line-height: 1.2; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prototype-pill {
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: var(--warn); border: 1px solid #5c4a24; background: #2a2110; letter-spacing: .4px;
    white-space: nowrap;
  }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .presence-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 11px; border-radius: 999px; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); white-space: nowrap;
  }
  .presence-pill .n { color: var(--good); font-weight: 600; }
  .icon-btn {
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2);
    color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s;
  }
  .icon-btn:hover { border-color: #3a4b6b; color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ===================================================================== *
   * 主体两栏
   * ===================================================================== */
  .body { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
    border-right: 1px solid var(--line-soft);
    background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 24px; }
  .sidebar-foot {
    padding: 10px 14px; border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--muted-2);
  }
  .sidebar-foot .sync { display: inline-flex; align-items: center; gap: 5px; }

  /* 受控端列表（默认折叠） */
  .bind-section { margin-bottom: 6px; border: 1px solid var(--line-soft); border-radius: var(--r-md); background: var(--panel-2); overflow: hidden; }
  .bind-head {
    width: 100%; display: flex; align-items: center; gap: 9px;
    padding: 11px 12px; background: transparent; border: 0; cursor: pointer; text-align: left;
  }
  .bind-head:hover { background: #1a2233; }
  .bind-head .lead { flex: 1; min-width: 0; }
  .bind-head .t { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .bind-head .s { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .bind-head .caret { color: var(--muted); transition: transform .18s ease; flex: 0 0 auto; }
  .bind-section.open .bind-head .caret { transform: rotate(90deg); }
  .bind-body { border-top: 1px solid var(--line-soft); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .bind-item {
    display: flex; align-items: center; gap: 9px; padding: 8px 9px;
    border: 1px solid var(--line-soft); border-radius: var(--r-sm); background: var(--panel-3);
  }
  .bind-item .meta { flex: 1; min-width: 0; }
  .bind-item .name { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .bind-item .id { font-family: var(--mono); font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bind-item .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #1c2740; color: var(--muted); border: 1px solid #26334d; }
  .mini-btn {
    font-size: 11px; padding: 4px 9px; border-radius: var(--r-sm); cursor: pointer;
    border: 1px solid var(--line); background: #1a2333; color: var(--text-2); white-space: nowrap;
  }
  .mini-btn:hover { border-color: #3a4b6b; }
  .mini-btn.danger { color: var(--bad); border-color: #5c2430; background: #2a0f14; }
  .bind-add { display: flex; gap: 6px; align-items: center; }
  .bind-add input {
    flex: 1; min-width: 0; background: var(--panel-3); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 7px 9px; font: 12px/1.4 var(--mono); outline: none;
  }
  .bind-add input:focus { border-color: #3e5b9a; }

  /* 受控端 → 工作区 → 会话 三级树 */
  .tree-title {
    padding: 14px 8px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .8px;
    text-transform: uppercase; color: var(--muted-2);
  }
  .tree { list-style: none; margin: 0; padding: 0; }
  .tree ul { list-style: none; margin: 0; padding: 0; }

  .node-row {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer;
    color: var(--text-2); min-width: 0; position: relative;
  }
  .node-row:hover { background: #182033; }
  .node-row.selected { background: #1b2a47; color: var(--text); }
  .caret { width: 14px; height: 14px; flex: 0 0 auto; display: grid; place-items: center; color: var(--muted); transition: transform .16s ease; }
  .caret svg { width: 12px; height: 12px; }
  .node-row.open > .caret { transform: rotate(90deg); }
  .caret.leaf { visibility: hidden; }
  .node-ico { width: 16px; height: 16px; flex: 0 0 auto; color: var(--muted); display: grid; place-items: center; }
  .node-ico svg { width: 16px; height: 16px; }
  .node-label { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-label .sub { color: var(--muted); font-size: 11px; }
  .node-tag {
    flex: 0 0 auto; font-size: 10px; padding: 1px 7px; border-radius: 999px; white-space: nowrap;
    color: var(--muted); background: #1a2333; border: 1px solid #263042;
  }
  .node-tag.running { color: var(--good); background: #0f2a21; border-color: #245c48; }
  .node-tag.archived { color: var(--muted-2); background: #171c26; }
  .node-tag.subagent { color: var(--accent); background: #14233f; border-color: #25406f; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--muted-2); }
  .dot.online { background: var(--good); animation: pulse 2.2s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(69,209,154,.45); }
    70%  { box-shadow: 0 0 0 7px rgba(69,209,154,0); }
    100% { box-shadow: 0 0 0 0 rgba(69,209,154,0); }
  }
  .count { flex: 0 0 auto; font-size: 10.5px; color: var(--muted-2); }
  .row-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; flex: 0 0 auto; }
  .node-row:hover .row-actions { opacity: 1; }
  .row-action {
    width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer;
  }
  .row-action:hover { background: #263042; color: var(--text); }
  .row-action.danger:hover { color: var(--bad); }
  .row-action svg { width: 13px; height: 13px; }
  .children { border-left: 1px solid var(--line-soft); margin-left: 15px; padding-left: 2px; }
  .rename-input {
    flex: 1; min-width: 0; background: var(--panel-3); color: var(--text); border: 1px solid #3e5b9a;
    border-radius: 6px; padding: 3px 7px; font: inherit; font-size: 12.5px; outline: none;
    box-shadow: 0 0 0 2px #1b2b4d;
  }
  .empty-tree { padding: 22px 12px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* ===================================================================== *
   * 主区
   * ===================================================================== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-2); }

  .main-header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 13px 22px; border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(180deg, rgba(18,23,34,.85), rgba(14,19,32,.55));
  }
  .main-header .crumbs { min-width: 0; flex: 1; }
  .crumbs .path { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs .title { display: flex; align-items: center; gap: 9px; margin-top: 2px; }
  .crumbs h1 { font-size: 16px; margin: 0; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  .conversation { flex: 1; overflow-y: auto; padding: 26px 22px 8px; scroll-behavior: smooth; }
  .conv-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; }

  .offline-banner {
    display: flex; align-items: center; gap: 9px; margin-bottom: 16px;
    padding: 10px 13px; border: 1px solid #5c4a24; border-radius: var(--r-md);
    background: #2a2110; color: #ffd9a0; font-size: 12.5px;
  }

  /* 消息 */
  .msg { display: flex; margin: 9px 0; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; gap: 11px; }
  .avatar {
    width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px;
    display: grid; place-items: center; margin-top: 1px;
    background: var(--accent-grad); color: #fff; font-size: 12px; font-weight: 700;
    box-shadow: 0 3px 10px rgba(49,92,255,.3);
  }
  .bubble { max-width: 82%; }
  .role-label { font-size: 11px; color: var(--muted); margin: 0 0 5px 2px; }
  .msg.user .role-label { text-align: right; margin-right: 2px; }
  .user-bubble {
    background: linear-gradient(135deg, #24324c, #1b2639);
    border: 1px solid #2c3a56; border-bottom-right-radius: 4px;
    border-radius: var(--r-md); padding: 10px 14px; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }

  /* 思考过程（默认折叠） */
  .thinking {
    border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--panel-3); margin-bottom: 9px; overflow: hidden;
  }
  .thinking-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 12px; text-align: left;
  }
  .thinking-toggle:hover { color: var(--text-2); }
  .thinking-toggle .caret { width: 12px; height: 12px; color: inherit; transition: transform .16s; }
  .thinking.open .thinking-toggle .caret { transform: rotate(90deg); }
  .thinking-toggle .hint { margin-left: auto; font-size: 10.5px; color: var(--muted-2); }
  .thinking-content {
    padding: 2px 14px 12px; border-top: 1px dashed var(--line-soft);
    color: var(--muted); font-size: 12.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }
  .thinking-content[hidden] { display: none; }

  /* Markdown 渲染 */
  .md { font-size: 14px; line-height: 1.68; word-break: break-word; }
  .md p { margin: 6px 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; font-weight: 650; line-height: 1.35; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
  .md h4 { font-size: 14px; } .md h5, .md h6 { font-size: 13px; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li::marker { color: var(--muted-2); }
  .md code {
    font-family: var(--mono); font-size: 12.5px; background: #0d1424;
    border: 1px solid #223048; border-radius: 5px; padding: 1px 5px; color: #a8c1ff;
  }
  .md pre {
    background: #0a0f19; border: 1px solid #1d2637; border-radius: var(--r-md);
    padding: 13px 15px; overflow-x: auto; margin: 10px 0; position: relative;
  }
  .md pre code { background: transparent; border: 0; padding: 0; color: #d7e2f7; font-size: 12.5px; }
  .md pre .lang {
    position: absolute; top: 7px; right: 10px; font-size: 10px; color: var(--muted-2);
    text-transform: uppercase; letter-spacing: .5px; font-family: var(--mono);
  }
  .md pre[data-lang] { padding-top: 30px; }
  .md blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--accent-2); color: var(--muted); background: rgba(49,92,255,.06); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
  .md blockquote p { margin: 4px 0; }
  .md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(122,162,255,.35); }
  .md a:hover { color: #b8ccff; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .md strong { color: var(--text); font-weight: 650; }
  .md del { color: var(--muted-2); }

  .tool-divider {
    display: flex; align-items: center; gap: 10px; margin: 12px 0;
    color: var(--muted-2); font-size: 11.5px;
  }
  .tool-divider::before, .tool-divider::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }

  /* 运行中指示 */
  .running-ind {
    display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
    font-size: 12.5px; padding: 9px 13px; border: 1px solid var(--line-soft);
    border-radius: var(--r-md); background: var(--panel);
  }
  .dots { display: inline-flex; gap: 3px; }
  .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; opacity: .6; }
  .empty-state p { margin: 4px 0; font-size: 13px; }

  /* ===================================================================== *
   * 输入区（继续对话）
   * ===================================================================== */
  .composer { flex: 0 0 auto; border-top: 1px solid var(--line-soft); background: var(--panel); padding: 12px 22px 14px; }
  .composer-inner { max-width: 820px; margin: 0 auto; }
  .composer-box {
    display: flex; align-items: flex-end; gap: 10px;
    border: 1px solid var(--line); border-radius: var(--r-lg);
    background: var(--panel-3); padding: 9px 9px 9px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer-box:focus-within { border-color: #3e5b9a; box-shadow: 0 0 0 3px #1b2b4d; }
  .composer textarea {
    flex: 1; min-width: 0; background: transparent; border: 0; resize: none; outline: none;
    color: var(--text); font: 14px/1.6 var(--font); max-height: 160px;
  }
  .composer textarea::placeholder { color: var(--muted-2); }
  .send-btn {
    flex: 0 0 auto; width: 38px; height: 38px; border: 0; border-radius: 10px;
    background: var(--accent-grad); color: #fff; cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 4px 12px rgba(49,92,255,.35);
    transition: transform .1s, filter .15s;
  }
  .send-btn:hover { filter: brightness(1.08); }
  .send-btn:active { transform: scale(.95); }
  .send-btn:disabled { filter: grayscale(.6) brightness(.7); cursor: not-allowed; box-shadow: none; }
  .send-btn svg { width: 17px; height: 17px; }
  .composer-hint { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted-2); margin-top: 7px; padding: 0 3px; }
  .composer-hint .kbd { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); }

  /* ===================================================================== *
   * 抽屉 / 遮罩（移动端）
   * ===================================================================== */
  .scrim {
    position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(0,0,0,.52);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 35;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 16px);
    opacity: 0; pointer-events: none; transition: .2s ease;
    background: #1c2638; border: 1px solid #3a4b6b; color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 13px; max-width: 82vw; z-index: 60;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { border-color: #6b2a35; color: #ffc2c9; }

  /* 工作区悬浮提示（目录 / 类型） */
  .ws-tooltip {
    position: fixed; z-index: 70; max-width: 340px;
    background: #0d1220; border: 1px solid #3a4b6b; border-radius: 10px;
    padding: 9px 12px; font-size: 12px; line-height: 1.6; color: var(--text-2);
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    opacity: 0; transform: translateY(4px); pointer-events: none;
    transition: opacity .12s ease, transform .12s ease;
  }
  .ws-tooltip.show { opacity: 1; transform: translateY(0); }
  .ws-tooltip .tt-row { display: flex; gap: 8px; align-items: baseline; }
  .ws-tooltip .tt-row + .tt-row { margin-top: 3px; }
  .ws-tooltip .tt-k { color: var(--muted); flex: 0 0 auto; }
  .ws-tooltip .tt-v { word-break: break-all; font-family: var(--mono); font-size: 11.5px; color: #a8c1ff; }

  /* ===================================================================== *
   * 响应式
   * ===================================================================== */
  @media (max-width: 900px) {
    .hamburger { display: inline-flex; }
    .sidebar {
      position: fixed; top: var(--topbar-h); left: 0; bottom: 0; z-index: 40;
      width: min(86vw, 340px);
      transform: translateX(-104%); transition: transform .24s ease;
      box-shadow: 0 0 46px rgba(0,0,0,.55);
    }
    .sidebar.open { transform: translateX(0); }
    .conversation { padding: 18px 14px 6px; }

  /* ===================================================================== *
   * Markdown 渲染（轻量子集）
   * ===================================================================== */
  function renderMarkdown(src) {
    var text = String(src == null ? '' : src);
    var codeBlocks = [];
    text = text.replace(/```([a-zA-Z0-9_+.-]*)\s*\n?([\s\S]*?)```/g, function (m, lang, code) {
      codeBlocks.push({ lang: String(lang || '').trim(), code: String(code).replace(/\n+$/, '') });
      return '\u0000CB' + (codeBlocks.length - 1) + '\u0000';
    });

    var lines = text.split('\n');
    var html = '';
    var listType = null;
    var para = [];

    function closeList() { if (listType) { html += '</' + listType + '>'; listType = null; } }
    function flushPara() { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } }
    function inline(s) {
      var out = esc(s);
      out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return out;
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var cb = line.match(/^\u0000CB(\d+)\u0000$/);
      if (cb) {
        closeList(); flushPara();
        var b = codeBlocks[Number(cb[1])];
        var langAttr = b.lang ? ' data-lang="' + esc(b.lang) + '"' : '';
        html += '<pre' + langAttr + '>' + (b.lang ? '<span class="lang">' + esc(b.lang) + '</span>' : '') + '<code>' + esc(b.code) + '</code></pre>';
        continue;
      }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        closeList(); flushPara();
        var lv = h[1].length;
        html += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>';
        continue;
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { closeList(); flushPara(); html += '<hr>'; continue; }
      var bq = line.match(/^\s*>\s?(.*)$/);
      if (bq) { closeList(); flushPara(); html += '<blockquote><p>' + inline(bq[1]) + '</p></blockquote>'; continue; }
      var ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) {
        flushPara();
        if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
        html += '<li>' + inline(ul[1]) + '</li>';
        continue;
      }
      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ol) {
        flushPara();
        if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
        html += '<li>' + inline(ol[1]) + '</li>';
        continue;
      }
      if (line.trim() === '') { closeList(); flushPara(); continue; }
      para.push(line);
    }
    closeList(); flushPara();
    return html;
  }

      html += '<span class="count">' + flattenSessions(agent).length + '</span>';
      html += '<span class="row-actions">';
      html += '<button class="row-action" data-action="rename" data-id="' + esc(agent.id) + '" title="修改别名（仅本机有效）">' + ICONS.pencil + '</button>';
      html += '</span>';
      html += '</div>';

      if (aOpen) {
        html += '<ul class="children">';
        (agent.workspaces || []).forEach(function (ws) {
          var wKey = wsKey(agent.id, ws.cwd);
          var wOpen = !!ui.expandedWorkspaces[wKey];
          var sessions = ws.sessions || [];
          html += '<li>';
          html += '<div class="node-row' + (wOpen ? ' open' : '') + '" data-action="toggle-ws" data-id="' + esc(wKey) + '">';
          html += '<span class="caret">' + ICONS.caret + '</span>';
          html += '<span class="node-ico">' + ICONS.folder + '</span>';
          html += '<span class="node-label">' + esc(ws.alias || ws.cwd) + '</span>';
          html += '<span class="count">' + sessions.length + '</span>';
          html += '<span class="row-actions">';
          html += '<button class="row-action" data-action="ws-info" data-id="' + esc(wKey) + '" title="查看工作区目录与类型" aria-label="查看工作区目录与类型">' + ICONS.info + '</button>';
          html += '</span>';
          html += '</div>';
          if (wOpen) {
            html += '<ul class="children">';
            sessions.forEach(function (s) { html += renderSessionNode(agent, ws, s); });
            html += '</ul>';
          }
          html += '</li>';
        });
        html += '</ul>';
      }
      html += '</li>';
    });
    html += '</ul>';

    box.innerHTML = html;

    /* 聚焦改名输入框 */
    if (ui.editingAgentId) {
      var input = $('renameInput');
      if (input) { input.focus(); input.select(); }
    }
  }

  function renderSessionNode(agent, ws, s) {
    var hasKids = s.children && s.children.length;
    var sKey = s.id;
    var sOpen = !!ui.expandedSessions[sKey];
    var selected = ui.selectedSessionId === s.id && ui.selectedAgentId === agent.id;
    var tag = s.running ? '<span class="node-tag running">运行中</span>'
      : (s.archived ? '<span class="node-tag archived">已归档</span>'
      : (s.origin === 'subagent' ? '<span class="node-tag subagent">子代理</span>' : ''));
    var html = '<li>';
    html += '<div class="node-row' + (hasKids && sOpen ? ' open' : '') + (selected ? ' selected' : '') + '" data-action="select-session" data-id="' + esc(s.id) + '">';
    html += '<span class="caret' + (hasKids ? '' : ' leaf') + '"' + (hasKids ? ' data-action="toggle-session" data-id="' + esc(s.id) + '"' : '') + '>' + ICONS.caret + '</span>';
    html += '<span class="node-ico">' + ICONS.chat + '</span>';
    html += '<span class="node-label" title="' + esc(s.title) + '">' + esc(s.title) + '</span>';
    html += tag;
    html += '</div>';
    if (hasKids && sOpen) {
      html += '<ul class="children">';
      s.children.forEach(function (c) { html += renderSessionNode(agent, ws, c); });
      html += '</ul>';
    }
    html += '</li>';
    return html;
  }

  /* ===================================================================== *
   * 主区渲染
   * ===================================================================== */
  function renderHeader() {
    var agent = agentById(ui.selectedAgentId);
    var session = findSession();
    var el = $('mainHeader');
    if (!agent || !session) {
      el.innerHTML = '<div class="crumbs"><div class="path">未选择</div><div class="title"><h1>选择一个会话</h1></div></div>';
      return;
    }
    var ws = null;
    (agent.workspaces || []).forEach(function (w) {
      (w.sessions || []).forEach(function (s) {
        if (s.id === session.id) { ws = w; return; }
        (s.children || []).forEach(function (c) { if (c.id === session.id) ws = w; });
      });
    });
    var tag = session.running ? '<span class="node-tag running">运行中</span>' : (session.archived ? '<span class="node-tag archived">已归档</span>' : '');
    el.innerHTML =
      '<div class="crumbs">' +
        '<div class="path">' + esc(aliasOf(agent)) + ' › ' + esc(ws ? (ws.alias || ws.cwd) : '工作区') + '</div>' +
        '<div class="title"><h1>' + esc(session.title) + '</h1>' + tag + '</div>' +
      '</div>' +
      '<div class="agent-status"><span class="dot ' + (agent.online ? 'online' : '') + '"></span>' + (agent.online ? '在线' : '离线 · ' + esc(agent.lastSeen)) + '</div>';
  }

  function renderConversation() {
    var agent = agentById(ui.selectedAgentId);
    var session = findSession();
    var el = $('conversation');
    if (!agent || !session) {
      el.innerHTML = '<div class="conv-inner"><div class="empty-state"><div class="big">💬</div><p>从左侧选择一个会话</p><p style="color:var(--muted-2)">受控端 › 工作区 › 会话 三级浏览，点击会话查看对话内容</p></div></div>';
      return;
    }

    var html = '<div class="conv-inner">';
    if (!agent.online) {
      html += '<div class="offline-banner">' + ICONS.info + ' 受控端当前离线，仅可查看已缓存的会话内容，暂不能发送。' + '</div>';
    }
    (session.messages || []).forEach(function (m) {
      if (m.role === 'tool') {
        html += '<div class="tool-divider">· ' + (m.count || 1) + ' 个工具调用（已折叠） ·</div>';
      } else if (m.role === 'user') {
        html += '<div class="msg user"><div class="bubble"><div class="role-label">你</div><div class="user-bubble md">' + renderMarkdown(m.text) + '</div></div></div>';
      } else if (m.role === 'assistant') {
        html += '<div class="msg assistant"><div class="avatar">A</div><div class="bubble">';
        html += '<div class="role-label">Agent · 受控端执行</div>';
        if (m.thinking) {
          html += '<div class="thinking" data-action="toggle-thinking">';
          html += '<button class="thinking-toggle"><span class="caret">' + ICONS.caret + '</span>思考过程<span class="hint">点击展开</span></button>';
          html += '<div class="thinking-content" hidden>' + esc(m.thinking) + '</div>';
          html += '</div>';
        }
        html += '<div class="md">' + renderMarkdown(m.text) + '</div>';
        html += '</div></div>';
      }
    });
    if (session.running) {
      html += '<div class="msg assistant"><div class="avatar">A</div><div class="bubble"><div class="role-label">Agent · 受控端执行</div><div class="running-ind"><span class="dots"><span></span><span></span><span></span></span>正在处理…</div></div></div>';
    }
    html += '</div>';
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  }

  function renderComposer() {
    var agent = agentById(ui.selectedAgentId);
    var session = findSession();
    var el = $('composer');
    if (!agent || !session) {
      el.innerHTML = '';
      return;
    }
    var disabled = !agent.online ? ' disabled' : '';
    el.innerHTML =
      '<div class="composer-inner">' +
        '<div class="composer-box">' +
          '<textarea id="promptInput" rows="1" placeholder="' + (agent.online ? '向该会话发送新指令，继续对话…' : '受控端离线，无法发送') + '"' + disabled + '></textarea>' +
          '<button class="send-btn" id="sendBtn" title="发送（Ctrl+Enter）" aria-label="发送"' + disabled + '>' + ICONS.send + '</button>' +
        '</div>' +
        '<div class="composer-hint"><span>指令经端到端加密后通过心跳邮箱投递给受控端</span><span><span class="kbd">Enter</span> 换行 · <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> 发送</span></div>' +
      '</div>';
  }

  function render() {
    var online = 0;
    AGENTS.forEach(function (a) { if (a.online) online++; });
    $('onlineCount').textContent = online;
    $('agentCount').textContent = AGENTS.length;
    $('syncTime').textContent = '刚刚同步';
    renderSidebar();
    renderHeader();
    renderConversation();
    renderComposer();
  }

  /* ===================================================================== *
   * 交互
   * ===================================================================== */
  function commitRename(agentId, value) {
    value = String(value || '').trim();
    if (value) aliases[agentId] = value; else delete aliases[agentId];
    ui.editingAgentId = null;
    renderSidebar();
    renderHeader();
    toast('别名已保存（仅本机有效）');
  }

  function doSend() {
    var agent = agentById(ui.selectedAgentId);
    var session = findSession();
    var input = $('promptInput');
    if (!agent || !session || !input) return;
    if (!agent.online) { toast('受控端离线，无法发送', true); return; }
    var text = String(input.value || '').trim();
    if (!text) return;

    session.messages = session.messages || [];
    session.messages.push({ role: 'user', text: text });
    session.running = true;
    input.value = '';
    input.style.height = 'auto';
    renderConversation();
    renderHeader();
    toast('已受理：指令已入队，等待受控端处理');

    /* 原型演示：模拟受控端返回一条新回复 */
    setTimeout(function () {
      session.running = false;
      session.messages.push({
        role: 'assistant',
        thinking: '（演示）受控端 Agent 收到指令后，先在本地推理并规划步骤，再执行工具并整理回复。真实场景中该内容来自受控端回传的加密结果信封。',
        text: '（原型演示回复）已收到并处理你的指令。\n\n真实场景下，这里会展示受控端 **Agent 的实际回复**，同样支持 Markdown 渲染与默认折叠的思考过程。'
      });
      renderConversation();
      renderHeader();
      toast('收到受控端回复（演示）');
    }, 1400);
  }

  function autoGrow() {
    var ta = this;
    ta.style.height = 'auto';
    ta.style.height = Math.min(160, ta.scrollHeight) + 'px';
  }

  function setDrawer(open) {
    ui.drawerOpen = open;
    $('sidebar').classList.toggle('open', open);
    $('scrim').classList.toggle('show', open);
  }

  /* 事件委托 */
  $('sidebarScroll').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var id = btn.getAttribute('data-id');

    if (action === 'toggle-bindings') { ui.bindingsOpen = !ui.bindingsOpen; renderSidebar(); return; }
    if (action === 'toggle-agent') {
      ui.expandedAgents[id] = !ui.expandedAgents[id];
      if (ui.selectedAgentId !== id) { ui.selectedAgentId = id; ui.selectedSessionId = null; }
      render();
      return;
    }
    if (action === 'toggle-ws') { ui.expandedWorkspaces[id] = !ui.expandedWorkspaces[id]; renderSidebar(); return; }
    if (action === 'toggle-session') { ui.expandedSessions[id] = !ui.expandedSessions[id]; renderSidebar(); return; }
    if (action === 'ws-info') {
      var tip = $('wsTooltip');
      if (tip.classList.contains('show')) { hideWsInfo(); }
      else { showWsInfo(btn, id); }
      return;
    }
    if (action === 'select-session') {
      ui.selectedSessionId = id;
      /* 定位该会话所属的受控端（会话可能位于任意受控端 / 子代理之下） */
      for (var a = 0; a < AGENTS.length; a++) {
        var list = flattenSessions(AGENTS[a]);
        for (var j = 0; j < list.length; j++) {
          if (list[j].id === id) { ui.selectedAgentId = AGENTS[a].id; break; }
        }
      }
      render();
      setDrawer(false);
      return;
    }
    if (action === 'rename') { ui.editingAgentId = id; renderSidebar(); return; }
    if (action === 'revoke') {
      if (!confirm('确认解除与「' + aliasOf(agentById(id)) + '」的配对？')) return;
      for (var k = AGENTS.length - 1; k >= 0; k--) if (AGENTS[k].id === id) { AGENTS.splice(k, 1); break; }
      if (ui.selectedAgentId === id) {
        ui.selectedAgentId = AGENTS.length ? AGENTS[0].id : null;
        ui.selectedSessionId = null;
      }
      render();
      toast('已解除配对（演示）');
      return;
    }
    if (action === 'bind-add') {
      var input = $('bindToken');
      if (input && input.value.trim()) { input.value = ''; toast('已发起配对，等待受控端确认（演示）'); }
      else toast('请先粘贴受控端 token', true);
      return;
    }
  });

  /* 工作区悬浮提示（鼠标悬停显示，离开隐藏；触屏用点击切换） */
  $('sidebarScroll').addEventListener('mouseover', function (e) {
    var btn = e.target.closest('[data-action="ws-info"]');
    if (btn) showWsInfo(btn, btn.getAttribute('data-id'));
  });
  $('sidebarScroll').addEventListener('mouseout', function (e) {
    var btn = e.target.closest('[data-action="ws-info"]');
    if (btn) hideWsInfo();
  });

  /* 改名输入框（keydown / blur） */
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'renameInput') {
      if (e.key === 'Enter') { e.preventDefault(); commitRename(e.target.getAttribute('data-agent'), e.target.value); }
      else if (e.key === 'Escape') { ui.editingAgentId = null; renderSidebar(); }
    }
  });
  document.addEventListener('focusout', function (e) {
    if (e.target && e.target.id === 'renameInput') {
      var agentId = e.target.getAttribute('data-agent');
      var value = e.target.value;
      /* 延迟到当前事件（点击其它元素）完成后再提交，避免重渲染吞掉目标点击 */
      setTimeout(function () {
        if (ui.editingAgentId === agentId) commitRename(agentId, value);
      }, 0);
    }
  });

  /* 思考过程折叠 */
  $('conversation').addEventListener('click', function (e) {
    var th = e.target.closest('[data-action="toggle-thinking"]');
    if (!th) return;
    th.classList.toggle('open');
    var content = th.querySelector('.thinking-content');
    content.hidden = !content.hidden;
  });

  /* 发送 */
  $('composer').addEventListener('click', function (e) {
    if (e.target.closest('#sendBtn')) doSend();
  });
  $('composer').addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'promptInput') {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doSend(); }
    }
  });
  $('composer').addEventListener('input', function (e) {
    if (e.target && e.target.id === 'promptInput') autoGrow.call(e.target);
  });

  /* 抽屉 / 顶栏 */
  $('hamburger').addEventListener('click', function () { setDrawer(!ui.drawerOpen); });
  $('scrim').addEventListener('click', function () { setDrawer(false); });
  $('refreshBtn').addEventListener('click', function () {
    ui.lastSync = Date.now();
    render();
    toast('已刷新在线状态与会话摘要（演示）');
  });

  /* 初始化 */
  render();
})();
</script>
</body>
</html>
